<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" role="img" aria-label="Как есть: из Crowdin переводы идут двумя путями — пакетом в WinForms-клиент и PR в веб-клиент. Как будет: все переводы выгружаются в localizationpackages и попадают в защищённую основную ветку только через проверенный PR; план переводов публикует рядом с nupkg npm-пакет веб-клиента той же версии; сборка веб-клиента ставит пакет точной версии из package.json, а Crowdin читает английский источник из репозитория веб-клиента.">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#444"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#c55"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- ===================== КАК ЕСТЬ ===================== -->
  <text x="20" y="30" font-size="16" font-weight="bold">Как есть</text>

  <rect x="200" y="46" width="186" height="50" rx="4" fill="#fff" stroke="#555"/>
  <text x="293" y="67" text-anchor="middle" font-weight="bold">Crowdin</text>
  <text x="293" y="85" text-anchor="middle" fill="#666" font-size="11">перевод · вычитка английского</text>

  <!-- vms-ui column -->
  <line x1="240" y1="96" x2="103" y2="150" stroke="#444" marker-end="url(#ar)"/>
  <text x="128" y="118" fill="#444" font-size="10">выгрузка</text>

  <rect x="20" y="150" width="166" height="46" rx="4" fill="#fff" stroke="#555"/>
  <text x="103" y="170" text-anchor="middle">localizationpackages</text>
  <text x="103" y="186" text-anchor="middle" fill="#666" font-size="11">.resx · .wxl · 34 языка</text>

  <line x1="103" y1="196" x2="103" y2="236" stroke="#444" marker-end="url(#ar)"/>
  <text x="110" y="220" fill="#444" font-size="10">план: nupkg</text>

  <rect x="20" y="236" width="166" height="46" rx="4" fill="#fff" stroke="#555"/>
  <text x="103" y="256" text-anchor="middle">Artifactory</text>
  <text x="103" y="272" text-anchor="middle" fill="#666" font-size="11">версия 1.0.N</text>

  <line x1="103" y1="282" x2="103" y2="322" stroke="#444" marker-end="url(#ar)"/>
  <text x="110" y="306" fill="#444" font-size="10">версия закреплена</text>

  <rect x="20" y="322" width="166" height="64" rx="6" fill="#f4fbf4" stroke="#8c8"/>
  <text x="103" y="344" text-anchor="middle" fill="#3a7a3a">WinForms-клиент</text>
  <text x="103" y="362" text-anchor="middle" font-size="11">в коде только</text>
  <text x="103" y="377" text-anchor="middle" font-size="11">английский источник</text>

  <!-- webclient column -->
  <line x1="340" y1="96" x2="440" y2="150" stroke="#c55" marker-end="url(#arr)"/>
  <text x="398" y="118" fill="#a33" font-size="10">PR локализатора</text>

  <rect x="350" y="150" width="176" height="236" rx="6" fill="#fff4f4" stroke="#d88"/>
  <text x="360" y="170" fill="#a33" font-size="11">Веб-клиент — переводы в коде</text>
  <text x="362" y="196">• 34 файла переводов</text>
  <text x="362" y="218">• разработчик правит</text>
  <text x="372" y="234">только английский —</text>
  <text x="372" y="250">по договорённости,</text>
  <text x="372" y="266">технически не закреплено</text>
  <text x="362" y="288">• вычитанный английский —</text>
  <text x="372" y="304">только при языке ровно en</text>
  <text x="362" y="326" fill="#a33">• en-US, pt-PT не находят</text>
  <text x="372" y="342" fill="#a33">файла — английский</text>


  <text x="293" y="424" text-anchor="middle" font-size="13">Одна команда, один Crowdin — пакет и PR в кодовую базу</text>
  <text x="293" y="446" text-anchor="middle" fill="#666" font-size="11">проверки переводов перед сборкой нет</text>

  <line x1="590" y1="20" x2="590" y2="590" stroke="#ddd" stroke-dasharray="4 4"/>

  <!-- ===================== КАК БУДЕТ ===================== -->
  <text x="612" y="30" font-size="16" font-weight="bold" fill="#1a73e8">Как будет</text>

  <rect x="800" y="46" width="190" height="50" rx="4" fill="#fff" stroke="#555"/>
  <text x="895" y="67" text-anchor="middle" font-weight="bold">Crowdin</text>
  <text x="895" y="85" text-anchor="middle" fill="#666" font-size="11">перевод на целевые языки</text>

  <line x1="895" y1="96" x2="895" y2="124" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="903" y="114" fill="#1a73e8" font-size="10">переводы — только сюда</text>

  <rect x="640" y="124" width="500" height="72" rx="6" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="652" y="142" fill="#5a7fa8" font-size="11">ONE/localizationpackages</text>
  <rect x="700" y="152" width="170" height="32" rx="4" fill="#fff" stroke="#999"/>
  <text x="785" y="173" text-anchor="middle">axxonnext.ui/</text>
  <rect x="920" y="152" width="170" height="32" rx="4" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1005" y="173" text-anchor="middle" fill="#1a73e8">webclient/</text>

  <line x1="895" y1="196" x2="895" y2="220" stroke="#1a73e8" marker-end="url(#arb)"/>

  <rect x="740" y="220" width="310" height="48" rx="4" fill="#fff" stroke="#1a73e8"/>
  <text x="895" y="240" text-anchor="middle">план localizationpackages</text>
  <rect x="820" y="249" width="150" height="15" rx="3" fill="#fff7e6" stroke="#e0a030"/>
  <text x="895" y="260" text-anchor="middle" fill="#9a6400" font-size="10">проверка на PR</text>

  <line x1="895" y1="268" x2="895" y2="294" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="903" y="285" fill="#1a73e8" font-size="10">Publish: npm-пакет 1.0.N рядом с nupkg</text>

  <rect x="640" y="294" width="500" height="80" rx="6" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="652" y="312" fill="#5a7fa8" font-size="11">Artifactory — что ставит сборка</text>
  <rect x="700" y="322" width="170" height="40" rx="4" fill="#fff" stroke="#999"/>
  <text x="785" y="339" text-anchor="middle" font-size="11">nupkg</text>
  <text x="785" y="354" text-anchor="middle" font-size="11" fill="#666">по пакету на язык</text>
  <rect x="920" y="322" width="170" height="40" rx="4" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1005" y="339" text-anchor="middle" font-size="11" fill="#1a73e8">@axxon-l10n/webclient</text>
  <text x="1005" y="354" text-anchor="middle" font-size="11" fill="#666">1.0.N</text>

  <line x1="785" y1="362" x2="785" y2="400" stroke="#444" marker-end="url(#ar)"/>
  <line x1="1005" y1="362" x2="1005" y2="400" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="1015" y="381" fill="#666" font-size="10">точная версия</text>
  <text x="1015" y="393" fill="#666" font-size="10">в package.json</text>

  <rect x="700" y="400" width="170" height="56" rx="4" fill="#fff" stroke="#555"/>
  <text x="785" y="422" text-anchor="middle">WinForms-клиент</text>
  <text x="785" y="440" text-anchor="middle" fill="#666" font-size="11">без изменений</text>

  <rect x="920" y="400" width="170" height="56" rx="4" fill="#fff" stroke="#1a73e8"/>
  <text x="1005" y="422" text-anchor="middle">веб-клиент</text>
  <rect x="947" y="431" width="116" height="15" rx="3" fill="#fff7e6" stroke="#e0a030"/>
  <text x="1005" y="442" text-anchor="middle" fill="#9a6400" font-size="10">сверка с источником</text>

  <!-- source read: web apps -> Crowdin -->
  <polyline points="1005,456 1005,470 1158,470 1158,71 994,71" fill="none" stroke="#1a73e8" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  <text x="1000" y="62" fill="#1a73e8" font-size="10">читает английский источник</text>

  <rect x="612" y="492" width="548" height="98" rx="6" fill="#f4fbf4" stroke="#8c8"/>
  <text x="622" y="512" fill="#3a7a3a" font-size="11">Итог</text>
  <text x="626" y="536">• английский — из strings.json разработчика, для всех языков</text>
  <text x="626" y="558">• ни одного PR от локализации в кодовую базу</text>
  <text x="626" y="580" fill="#3a7a3a">• одна схема для обоих клиентов, битый перевод не доходит до экрана</text>
</svg>
