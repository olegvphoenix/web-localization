<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" width="1180" height="380" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" role="img" aria-label="Путь перевода: Crowdin читает английский источник из репозитория приложения и выгружает переводы в localizationpackages; переводы попадают в защищённую основную ветку только через PR и только пройдя проверку целостности файлов; стадия Publish плана переводов публикует из неё npm-пакет версии 1.0.N, версию которого в package.json приложения поднимают сборщики; сборка приложения ставит пакет, сверяет переводы с источником и собирает архив приложения. Ошибка на PR не даёт его влить; сверка в сборке её не роняет — строку с расхождением пропускает, на экране остаётся английский.">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#444"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#1a73e8"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#c55"/>
    </marker>
  </defs>

  <!-- app repo (top right) -->
  <rect x="800" y="14" width="190" height="42" rx="4" fill="#fff" stroke="#555"/>
  <text x="895" y="33" text-anchor="middle" font-weight="bold">репозиторий приложения</text>
  <text x="895" y="49" text-anchor="middle" fill="#666" font-size="11">английский источник — и всё</text>

  <!-- source read to Crowdin -->
  <polyline points="800,35 95,35 95,98" fill="none" stroke="#1a73e8" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a73e8" font-size="10">Crowdin читает источник — только чтение</text>

  <line x1="895" y1="56" x2="895" y2="98" stroke="#444" marker-end="url(#ar)"/>
  <text x="903" y="80" fill="#444" font-size="10">исходники</text>

  <!-- 1 Crowdin -->
  <rect x="20" y="98" width="150" height="80" rx="4" fill="#fff" stroke="#555"/>
  <text x="95" y="120" text-anchor="middle" font-weight="bold">Crowdin</text>
  <text x="95" y="138" text-anchor="middle" font-size="11">плейсхолдеры и ICU</text>
  <rect x="34" y="150" width="122" height="18" rx="3" fill="#f6f6f6" stroke="#bbb"/>
  <text x="95" y="163" text-anchor="middle" fill="#666" font-size="10">не даёт сохранить</text>

  <line x1="170" y1="138" x2="206" y2="138" stroke="#444" marker-end="url(#ar)"/>
  <text x="188" y="92" text-anchor="middle" fill="#444" font-size="10">выгрузка</text>

  <!-- 2 loc repo -->
  <rect x="206" y="98" width="170" height="80" rx="4" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="291" y="120" text-anchor="middle" font-weight="bold">localizationpackages</text>
  <text x="291" y="146" text-anchor="middle" font-size="11">webclient/</text>

  <line x1="376" y1="138" x2="412" y2="138" stroke="#444" marker-end="url(#ar)"/>

  <!-- 3 plan with gate 1 -->
  <rect x="412" y="98" width="180" height="80" rx="4" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="502" y="126" text-anchor="middle" font-weight="bold">проверка на PR</text>
  <text x="502" y="148" text-anchor="middle" font-size="11">JSON · дубли ключей</text>
  <text x="502" y="164" text-anchor="middle" font-size="11">· набор файлов</text>

  <line x1="592" y1="138" x2="628" y2="138" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="610" y="130" text-anchor="middle" fill="#1a73e8" font-size="10">влит</text>

  <!-- 4 tag -->
  <rect x="628" y="98" width="150" height="80" rx="4" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="703" y="122" text-anchor="middle" font-weight="bold">основная ветка</text>
  <text x="703" y="142" text-anchor="middle" fill="#666" font-size="11">защищена: только PR,</text>
  <text x="703" y="158" text-anchor="middle" fill="#666" font-size="11">только с проверкой</text>


  <!-- 5 app build with gate 2 -->
  <rect x="814" y="98" width="180" height="80" rx="4" fill="#fff7e6" stroke="#e0a030" stroke-width="1.5"/>
  <text x="904" y="126" text-anchor="middle" font-weight="bold">сборка приложения</text>
  <text x="904" y="148" text-anchor="middle" font-size="11">сверка: плейсхолдеры</text>
  <text x="904" y="164" text-anchor="middle" font-size="11">против источника</text>

  <line x1="994" y1="138" x2="1030" y2="138" stroke="#1a73e8" marker-end="url(#arb)"/>

  <!-- 6 archive -->
  <rect x="1030" y="98" width="130" height="80" rx="6" fill="#f4fbf4" stroke="#8c8"/>
  <text x="1095" y="120" text-anchor="middle" font-weight="bold" fill="#3a7a3a">архив</text>
  <text x="1095" y="138" text-anchor="middle" font-size="11">как сегодня</text>
  <text x="1095" y="154" text-anchor="middle" font-size="11">→ сборка сервера</text>

  <!-- failure branch: gate 1 -->
  <line x1="502" y1="178" x2="502" y2="214" stroke="#c55" marker-end="url(#arr)"/>
  <text x="510" y="200" fill="#a33" font-size="10">ошибка</text>
  <rect x="412" y="214" width="180" height="58" rx="4" fill="#fff4f4" stroke="#d88"/>
  <text x="502" y="234" text-anchor="middle" fill="#a33">PR не вливается</text>
  <text x="502" y="252" text-anchor="middle" fill="#666" font-size="11">отчёт: язык · ключ · что не так</text>
  <text x="502" y="266" text-anchor="middle" fill="#666" font-size="11">чинят локализаторы</text>

  <!-- warning branch: gate 2 -->
  <line x1="904" y1="178" x2="904" y2="214" stroke="#e0a030" marker-end="url(#ar)"/>
  <text x="912" y="200" fill="#9a6400" font-size="10">не прошла проверку</text>
  <rect x="814" y="214" width="180" height="58" rx="4" fill="#fff7e6" stroke="#e0a030"/>
  <text x="904" y="234" text-anchor="middle" fill="#9a6400">строка пропущена</text>
  <text x="904" y="252" text-anchor="middle" fill="#666" font-size="11">на экране — английский</text>
  <text x="904" y="266" text-anchor="middle" fill="#666" font-size="11">в журнале — предупреждение</text>

  <!-- publish path -->
  <rect x="628" y="214" width="150" height="58" rx="4" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="703" y="234" text-anchor="middle">npm-пакет 1.0.N</text>
  <text x="703" y="252" text-anchor="middle" fill="#666" font-size="11">Publish запускают сборщики,</text>
  <text x="703" y="266" text-anchor="middle" fill="#666" font-size="11">в npm-local Artifactory</text>
  <line x1="703" y1="178" x2="703" y2="214" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="710" y="200" fill="#1a73e8" font-size="10">Publish</text>
  <polyline points="778,243 798,243 798,170 814,170" fill="none" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="703" y="292" text-anchor="middle" fill="#1a73e8" font-size="10">точная версия записана в package.json приложения — поднимают сборщики</text>

  <line x1="20" y1="322" x2="1160" y2="322" stroke="#eee"/>
  <text x="20" y="344" fill="#666" font-size="11">В репозиторий приложения не приходят ни файлы переводов, ни PR от локализации — только версия пакета в package.json, её поднимают сборщики. Нет пакета — английский и предупреждение.</text>
  <text x="20" y="364" fill="#666" font-size="11">Эталон — источник приложения. Чаще всего строку пропускают из-за плейсхолдеров, изменённых в источнике после перевода: это не ошибка, а разница во времени.</text>
</svg>
