<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="1060" height="610" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#222" role="img" aria-label="Путь нового ключа: разработчик добавляет ключ в английский источник и заводит задачу; Crowdin находит новую строку при синхронизации источника; локализаторы переводят и одобряют её на всех языках; переводы выгружаются в localizationpackages; проверка на PR пропускает их в основную ветку со списком изменённых ключей; сборщик публикует npm-пакет и поднимает его версию в приложении одним коммитом; очередная сборка ставит пакет и проверяет переводы. До этой сборки пользователь видит английский разработчика.">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#444"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- lifeline heads -->
  <rect x="30" y="16" width="140" height="44" rx="4" fill="#fff" stroke="#555"/>
  <text x="100" y="43" text-anchor="middle" font-weight="bold">Разработчик</text>

  <rect x="210" y="16" width="160" height="44" rx="4" fill="#fff" stroke="#555"/>
  <text x="290" y="35" text-anchor="middle" font-weight="bold">Приложение</text>
  <text x="290" y="51" text-anchor="middle" fill="#666" font-size="11">репозиторий и сборка</text>

  <rect x="410" y="16" width="140" height="44" rx="4" fill="#fff" stroke="#555"/>
  <text x="480" y="43" text-anchor="middle" font-weight="bold">Crowdin</text>

  <rect x="590" y="16" width="140" height="44" rx="4" fill="#fff" stroke="#555"/>
  <text x="660" y="43" text-anchor="middle" font-weight="bold">Локализаторы</text>

  <rect x="770" y="16" width="160" height="44" rx="4" fill="#f2f7fd" stroke="#9cc0ea"/>
  <text x="850" y="35" text-anchor="middle" font-weight="bold">localizationpackages</text>
  <text x="850" y="51" text-anchor="middle" fill="#666" font-size="11">и его план</text>



  <!-- lifelines -->
  <line x1="100" y1="60" x2="100" y2="550" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="290" y1="60" x2="290" y2="550" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="480" y1="60" x2="480" y2="550" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="660" y1="60" x2="660" y2="550" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="850" y1="60" x2="850" y2="550" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- developer-English band on the app lifeline -->
  <rect x="284" y="96" width="12" height="344" fill="#fff4f4" stroke="#d88"/>

  <!-- 1 -->
  <circle cx="100" cy="100" r="9" fill="#222"/><text x="100" y="104" text-anchor="middle" fill="#fff" font-size="10">1</text>
  <line x1="110" y1="100" x2="282" y2="100" stroke="#444" marker-end="url(#ar)"/>
  <text x="196" y="92" text-anchor="middle" font-size="11">ключ + английский, PR</text>

  <!-- 2 -->
  <circle cx="100" cy="150" r="9" fill="#222"/><text x="100" y="154" text-anchor="middle" fill="#fff" font-size="10">2</text>
  <line x1="110" y1="150" x2="652" y2="150" stroke="#444" marker-end="url(#ar)"/>
  <text x="380" y="142" text-anchor="middle" font-size="11">задача DANV «Локализация»: где на экране, скриншот</text>

  <!-- 3 -->
  <circle cx="480" cy="200" r="9" fill="#222"/><text x="480" y="204" text-anchor="middle" fill="#fff" font-size="10">3</text>
  <line x1="298" y1="200" x2="470" y2="200" stroke="#1a73e8" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  <text x="384" y="192" text-anchor="middle" fill="#1a73e8" font-size="11">синхронизация источника</text>
  <text x="384" y="216" text-anchor="middle" fill="#666" font-size="10">Crowdin сам видит новую строку</text>

  <!-- 4 -->
  <circle cx="660" cy="250" r="9" fill="#222"/><text x="660" y="254" text-anchor="middle" fill="#fff" font-size="10">4</text>
  <line x1="650" y1="250" x2="488" y2="250" stroke="#444" marker-end="url(#ar)"/>
  <text x="569" y="242" text-anchor="middle" font-size="11">перевод и одобрение, без en</text>

  <!-- 5 -->
  <circle cx="480" cy="300" r="9" fill="#222"/><text x="480" y="304" text-anchor="middle" fill="#fff" font-size="10">5</text>
  <line x1="490" y1="300" x2="842" y2="300" stroke="#444" marker-end="url(#ar)"/>
  <text x="666" y="292" text-anchor="middle" font-size="11">выгрузка переводов</text>

  <!-- 6 -->
  <rect x="800" y="320" width="100" height="22" rx="3" fill="#fff7e6" stroke="#e0a030"/>
  <text x="850" y="335" text-anchor="middle" fill="#9a6400" font-size="10">проверка на PR</text>
  <circle cx="850" cy="366" r="9" fill="#222"/><text x="850" y="370" text-anchor="middle" fill="#fff" font-size="10">6</text>
  <text x="862" y="362" fill="#1a73e8" font-size="11">PR влит после проверки</text>
  <text x="862" y="380" fill="#666" font-size="10">+ список изменённых ключей</text>
  <text x="862" y="398" fill="#666" font-size="10">сборщик запускает Publish: пакет 1.0.N</text>

  <!-- 7 -->
  <circle cx="850" cy="440" r="9" fill="#222"/><text x="850" y="444" text-anchor="middle" fill="#fff" font-size="10">7</text>
  <line x1="840" y1="440" x2="298" y2="440" stroke="#1a73e8" marker-end="url(#arb)"/>
  <text x="569" y="432" text-anchor="middle" fill="#1a73e8" font-size="11">сборщик поднимает версию пакета в приложении — один коммит</text>
  <text x="569" y="456" text-anchor="middle" fill="#666" font-size="10">файлов переводов в репозиторий приложения не приходит; очередная сборка ставит пакет</text>
  <rect x="300" y="470" width="100" height="18" rx="3" fill="#fff7e6" stroke="#e0a030"/>
  <text x="350" y="483" text-anchor="middle" fill="#9a6400" font-size="10">сверка в сборке</text>

  <!-- legend -->
  <rect x="30" y="570" width="12" height="14" fill="#fff4f4" stroke="#d88"/>
  <text x="50" y="582" fill="#a33" font-size="11">до сборки с новой версией пакета (шаг 7) пользователь видит новую строку на английском разработчика; после неё — переводы; английский всегда из strings.json.</text>
</svg>
